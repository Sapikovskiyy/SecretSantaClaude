<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2A1F1B" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Santomi — Тайный Санта для друзей, семьи и команды" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Santomi</title>
    <!--
      Telegram SDK: requested only for a Telegram launch (launch params / native proxy / Telegram Web
      iframe), async so it never blocks first paint. main.tsx binds it before the first render.
      Keep the detection in sync with launchedInTelegram() in src/lib/telegram.ts.
    -->
    <script>
      ;(function () {
        var t = /tgWebApp/.test(location.hash) || 'TelegramWebviewProxy' in window || window.parent !== window
        try { t = t || !!sessionStorage.getItem('__telegram__initParams') } catch (e) {}
        if (!t) return
        var s = document.createElement('script')
        s.id = 'tg-sdk'
        s.async = true
        s.src = 'https://telegram.org/js/telegram-web-app.js'
        document.head.appendChild(s)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
